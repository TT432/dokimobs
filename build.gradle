plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'io.freefair.lombok'
}

// Stonecutter 0.9 centralScript: 此脚本对每个 version node (:1.20.1, :1.21.1, :26.1.2) 各跑一次。
// 版本比较用 sc.current.parsed.matches（0.8+ API，替代旧 stonecutter.eval）。
def isLegacyForge = sc.current.parsed.matches '<1.20.6'
def isModern = sc.current.parsed.matches '>=26.1'

// Stonecutter 常量：源码中用 //? if legacy / //? if modern 做三路分支
stonecutter {
    constants['legacy'] = isLegacyForge
    constants['modern'] = isModern
}

// Stonecutter centralScript 不自动替换 sourceSet（0.7-0.9 均如此）：compileJava 默认编译 src/main/java，
// 但加了 //? 注释后原始源码有裸露的 else 分支导致语法错误。
// 必须让 sourceSet 指向 stonecutterGenerate 的生成目录。
def stonecutterMainBase = layout.buildDirectory.dir('generated/stonecutter/main')
sourceSets.main.java.srcDirs = [stonecutterMainBase.map { it.dir('java') }]
sourceSets.main.resources.srcDirs = [stonecutterMainBase.map { it.dir('resources') }]
compileJava.dependsOn 'stonecutterGenerate'
processResources.dependsOn 'stonecutterGenerate'

// Stonecutter file handler 处理 dokimobs.mixins.json 的 //? 版本条件（见 stonecutter.gradle 注册 inherit java→json）。
// comment-out 策略产出含注释的 json5，剥离为纯 JSON 供 Mixin 运行时解析。
def cleanGeneratedJson = tasks.register('cleanGeneratedJson') {
    dependsOn 'stonecutterGenerate'
    doLast {
        def file = stonecutterMainBase.get().dir('resources').file('dokimobs.mixins.json').asFile
        if (!file.exists()) return
        def text = file.text
        text = text.replaceAll(/(?s)\/\*.*?\*\//, '')
        text = text.replaceAll(/\/\/[^\r\n]*/, '')
        text = text.replaceAll(/,(\s*[\]\}])/, '$1')
        file.text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parseText(text))
        )
    }
}
processResources.dependsOn cleanGeneratedJson

if (isLegacyForge) {
    apply plugin: 'net.neoforged.moddev.legacyforge'
} else {
    apply plugin: 'net.neoforged.moddev'
}

if (project == rootProject) {
    tasks.named('wrapper', Wrapper).configure {
        distributionType = Wrapper.DistributionType.BIN
    }
}

version = "${mod_version}+${minecraft_version}-${isLegacyForge ? 'forge' : 'neoforge'}"
group = mod_group_id

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            mavenLocal()
        }
        // eyelib（及其拆分的模块）一律从本地 mavenLocal 解析（../qylEyelib 发布），
        // 避免命中 Maven Central 上的旧版发布。
        filter {
            includeGroup "io.github.tt432"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(property('java_version') as int)

// eyelib 本地 mavenLocal 坐标（../qylEyelib 发布，见 settings.gradle 注释）
def eyelibArtifact = "io.github.tt432:eyelib:${eyelib_version}+${minecraft_version}-${isLegacyForge ? 'forge' : 'neoforge'}"

if (isLegacyForge) {
    legacyForge {
        version = project.minecraft_version + '-' + project.forge_version

        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }

        runs {
            client {
                client()
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
} else {
    neoForge {
        version = project.neoforge_version

        // 26.1+ 去混淆，无需 parchment
        if (!isModern) {
            parchment {
                mappingsVersion = project.parchment_mappings_version
                minecraftVersion = project.parchment_minecraft_version
            }
        }

        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            if (!isModern) {
                data {
                    data()
                    programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
                }
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // 独立 configuration 用于解析 eyelib jar（不继承到 runtimeClasspath，避免 classpath 冲突）
    eyelibJar {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // clientsmoke（AIDebugServer 调试端口）独立解析配置，同 eyelibJar 不继承 runtimeClasspath
    clientsmokeJar {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
if (isLegacyForge) {
    obfuscation {
        createRemappingConfiguration(configurations.localRuntime)
    }
}

dependencies {
    // 显式添加 Lombok：MDG 可能重配置 annotationProcessorPath，覆盖 freefair lombok 插件自动添加的处理器。
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    compileOnly eyelibArtifact

    // clientsmoke 调试 mod（mcmcp/AIDebugServer）：运行时加载规则同 eyelib（见下方注释）
    def clientsmokeArtifact = "io.github.tt432:clientsmoke:${eyelib_version}+${minecraft_version}-${isLegacyForge ? 'forge' : 'neoforge'}"
    if (isLegacyForge) {
        modLocalRuntime clientsmokeArtifact
    } else if (!isModern) {
        clientsmokeJar clientsmokeArtifact
    } else {
        localRuntime clientsmokeArtifact
    }

    // 运行时加载 eyelib mod：
    // - 1.20.1 Forge：modLocalRuntime（MDG 自动 SRG→Mojmap remap + 注册 mod discovery；
    //   必须用 modLocalRuntime，plain localRuntime 不 remap 会 NoSuchMethodError）
    // - 1.21.1 NeoForge：MDG 不将 localRuntime 的外部 mod jar 注册到 mod discovery，
    //   用 copyEyelibToMods 复制到 run/mods（禁止 localRuntime+mods/ 双份 → 类加载冲突）
    // - 26.1 NeoForge：localRuntime 自动注册
    if (isLegacyForge) {
        modLocalRuntime eyelibArtifact
    } else if (!isModern) {
        eyelibJar eyelibArtifact
    } else {
        localRuntime eyelibArtifact
    }

    compileOnly 'org.jetbrains:annotations:26.0.2'
}

// 1.20.1 节点当前无任何 mixin（唯一的 EntityTypeMixin 门控为 >=1.21，passengerAttachments API）。
// 不注册 mixin refmap——否则 reobfJar 会因缺失 dokimobs.refmap.json.mappings.tsrg 失败。
// 若未来添加 <1.21 的 mixin，需恢复 mixin {} 块与 mixin AP：
//   mixin { add sourceSets.main, "${mod_id}.refmap.json"; config "${mod_id}.mixins.json" }
//   dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }

jar {
    if (isLegacyForge) {
        manifest.attributes([
                "MixinConfigs": "${mod_id}.mixins.json"
        ])
    }
}

// 1.21.1 NeoForge：将 eyelib jar 复制到 run/mods 使其被 mod discovery 扫描到
if (!isLegacyForge && !isModern) {
    // 复制前先清掉 run/mods 里同名 artifact 的旧版本 jar（additive copy 不覆盖删除，
    // 旧版本残留会同 modid 双加载）
    def eyelibModsDir = project.file('run/mods')
    tasks.register('copyEyelibToMods', Copy) {
        from(configurations.eyelibJar)
        from(configurations.clientsmokeJar)
        into eyelibModsDir
        doFirst {
            eyelibModsDir.listFiles((dir, name) ->
                    name.startsWith('eyelib-') || name.startsWith('clientsmoke-'))?.each { it.delete() }
        }
    }
    tasks.matching { it.name == 'createMinecraftArtifacts' }.configureEach {
        finalizedBy 'copyEyelibToMods'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : findProperty('forge_version') ?: '',
            forge_version_range    : findProperty('forge_version_range') ?: '',
            loader_version_range   : findProperty('loader_version_range') ?: '',
            neoforge_version       : findProperty('neoforge_version') ?: '',
            neoforge_version_range : findProperty('neoforge_version_range') ?: '',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            pack_format_number     : pack_format_number,
            eyelib_version         : eyelib_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from stonecutterMainBase.map { it.dir('templates') }
    // NeoForge 1.20.6+ requires neoforge.mods.toml; Forge 1.20.1 requires mods.toml
    if (isLegacyForge) {
        exclude 'META-INF/neoforge.mods.toml'
    } else {
        exclude 'META-INF/mods.toml'
    }
    into "build/generated/sources/modMetadata"
}
generateModMetadata.configure { dependsOn 'stonecutterGenerate' }
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
if (isLegacyForge) {
    legacyForge.ideSyncTask generateModMetadata
} else {
    neoForge.ideSyncTask generateModMetadata
}

// Stonecutter //? 预处理输出（build/generated/stonecutter/）被 ModDevGradle createMinecraftArtifacts 读取，
// 需显式声明 task 依赖，否则 Gradle task validation 报 implicit_dependency 错误。
tasks.matching { it.name == 'createMinecraftArtifacts' }.configureEach {
    dependsOn tasks.matching { it.name == 'stonecutterGenerate' }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // stonecutter node 的 project.name 是版本号，artifactId 必须显式固定为 mod_id
            artifactId = mod_id
            from components.java
            suppressPomMetadataWarningsFor('reobfApiElements')
            suppressPomMetadataWarningsFor('reobfRuntimeElements')
        }
    }
    repositories {
        mavenLocal()
        maven {
            url "file://${project.rootProject.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000', '-Xmaxwarns', '100']
    // Java 21+ javac 模块封装阻止 Lombok 访问内部 API，需 javaagent + --add-opens。
    // javaagent 方式同时规避 Lombok 1.18.46 在 Java 25 javac 上的初始化崩溃。
    def lombokJar = configurations.detachedConfiguration(
            dependencies.create('org.projectlombok:lombok:1.18.46')
    ).singleFile
    options.fork = true
    options.forkOptions.jvmArgs += "-javaagent:${lombokJar.absolutePath}".toString()
    ['code', 'comp', 'file', 'main', 'model', 'parser', 'processing', 'tree', 'util', 'api', 'jvm'].each { pkg ->
        options.forkOptions.jvmArgs += ['--add-opens', "jdk.compiler/com.sun.tools.javac.${pkg}=ALL-UNNAMED".toString()]
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
